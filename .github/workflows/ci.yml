name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the checks only ever need to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholars
          POSTGRES_PASSWORD: scholars
          POSTGRES_DB: scholars_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scholars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://scholars:scholars@127.0.0.1:5432/scholars_test
    steps:
      # Third-party actions are pinned to an exact commit, so a hijacked version tag cannot slip code into our
      # builds. Dependabot (see dependabot.yml) proposes updates; the comment shows the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Block on anything that actually ships to students (production dependencies only).
      - name: Fail on any new high or critical vulnerability in what we ship
        run: npm audit --omit=dev --audit-level=high
      # Build and test tools never reach users, and a fix may not exist yet (17 Nov 2026: picomatch, no patched
      # release). Still report them, but do not let them hide the format, lint, type and test results below.
      - name: Report vulnerabilities in build and test tools (does not block)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
